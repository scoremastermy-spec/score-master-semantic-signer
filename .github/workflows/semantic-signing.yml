name: Protected Semantic Receipt Signer

on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Canonical attestation contract version
        required: true
        type: string
      batch_id:
        description: Opaque local batch identifier
        required: true
        type: string
      subject:
        description: Subject identifier only
        required: true
        type: string
      form:
        description: Form identifier only
        required: true
        type: string
      request_sha256:
        description: SHA-256 of canonical local signing request
        required: true
        type: string
      requirements_digest:
        description: SHA-256 of requirements provenance
        required: true
        type: string
      provenance_digest:
        description: SHA-256 of local provenance record
        required: true
        type: string
      source_manifest_digest:
        description: SHA-256 of certified source manifest
        required: true
        type: string
      blueprint_digest:
        description: SHA-256 of blueprint record
        required: true
        type: string

permissions: {}

jobs:
  sign:
    name: Sign approved semantic receipt
    runs-on: ubuntu-latest
    environment:
      name: semantic-signing
    permissions:
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: v3.1.3

      - name: Build canonical non-proprietary receipt
        shell: bash
        env:
          CONTRACT_VERSION: ${{ inputs.contract_version }}
          BATCH_ID: ${{ inputs.batch_id }}
          SUBJECT: ${{ inputs.subject }}
          FORM: ${{ inputs.form }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REQUIREMENTS_DIGEST: ${{ inputs.requirements_digest }}
          PROVENANCE_DIGEST: ${{ inputs.provenance_digest }}
          SOURCE_MANIFEST_DIGEST: ${{ inputs.source_manifest_digest }}
          BLUEPRINT_DIGEST: ${{ inputs.blueprint_digest }}
        run: |
          set -euo pipefail
          digest_names=(REQUEST_SHA256 REQUIREMENTS_DIGEST PROVENANCE_DIGEST SOURCE_MANIFEST_DIGEST BLUEPRINT_DIGEST)
          for digest_name in "${digest_names[@]}"; do
            digest="${!digest_name}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo "invalid SHA-256 input: $digest_name" >&2; exit 64; }
          done
          [[ "$CONTRACT_VERSION" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo 'invalid contract_version' >&2; exit 64; }
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo 'invalid batch_id' >&2; exit 64; }
          [[ "$SUBJECT" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo 'invalid subject' >&2; exit 64; }
          [[ "$FORM" =~ ^[A-Za-z0-9._-]{1,32}$ ]] || { echo 'invalid form' >&2; exit 64; }
          jq -cnS \
            --arg contract_version "$CONTRACT_VERSION" \
            --arg batch_id "$BATCH_ID" \
            --arg subject "$SUBJECT" \
            --arg form "$FORM" \
            --arg request_sha256 "$REQUEST_SHA256" \
            --arg requirements_digest "$REQUIREMENTS_DIGEST" \
            --arg provenance_digest "$PROVENANCE_DIGEST" \
            --arg source_manifest_digest "$SOURCE_MANIFEST_DIGEST" \
            --arg blueprint_digest "$BLUEPRINT_DIGEST" \
            --arg repository "${{ github.repository }}" \
            --arg workflow_ref "${{ github.workflow_ref }}" \
            --arg environment 'semantic-signing' \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{attestation_type:"score-master-semantic-receipt",contract_version:$contract_version,batch_id:$batch_id,subject:$subject,form:$form,request_sha256:$request_sha256,requirements_digest:$requirements_digest,provenance_digest:$provenance_digest,source_manifest_digest:$source_manifest_digest,blueprint_digest:$blueprint_digest,signer_repository:$repository,signer_workflow_ref:$workflow_ref,signer_environment:$environment,github_run_id:$run_id,github_run_attempt:$run_attempt,generated_at:$generated_at}' \
            > semantic-receipt.json

      - name: Keyless sign receipt with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore")"
          export SIGSTORE_ID_TOKEN="$(jq -er '.value' <<< "$token_response")"
          cosign sign-blob --yes --bundle semantic-receipt.sigstore.json semantic-receipt.json
          unset SIGSTORE_ID_TOKEN

      - name: Publish signed receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-receipt-${{ github.run_id }}
          path: |
            semantic-receipt.json
            semantic-receipt.sigstore.json
          if-no-files-found: error
          retention-days: 7