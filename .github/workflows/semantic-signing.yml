name: Protected Semantic Receipt Signer

on:
  workflow_dispatch:
    inputs:
      payload_batch_b64:
        description: Canonical hash-only semantic receipt batch
        required: true
        type: string

permissions: {}

jobs:
  sign:
    name: Sign approved canonical semantic receipts
    runs-on: ubuntu-latest
    environment:
      name: semantic-signing
    permissions:
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: v2.5.2

      - name: Validate and materialize exact canonical payloads
        shell: bash
        env:
          PAYLOAD_BATCH_B64: ${{ inputs.payload_batch_b64 }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mkdir -p receipts
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, sys
          def no_dupes(pairs):
              out = {}
              for key, value in pairs:
                  if key in out: raise ValueError('duplicate JSON key')
                  out[key] = value
              return out
          def load(raw):
              return json.loads(raw.decode('utf-8'), object_pairs_hook=no_dupes, parse_float=lambda _: (_ for _ in ()).throw(ValueError('floats forbidden')))
          def canon(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8') + b'\n'
          digest = re.compile(r'^[a-f0-9]{64}$'); ident = re.compile(r'^[A-Za-z0-9._-]{1,128}$')
          payload_keys = {'receipt_contract_version','semantic_core_contract_version','signer_contract_version','batch_id','request_id','subject_id','form','semantic_target_type','semantic_target_id','requirement_set_id','requirements','provenance_binding','source_manifest','source_evidence_binding_digest','blueprint_binding','semantic_review','semantic_review_payload_sha256','canonical_batch_sha256','issued_at','expires_at','receipt_id','nonce','signer_repository','signer_workflow_ref','signer_environment'}
          try:
              batch = load(base64.b64decode(os.environ['PAYLOAD_BATCH_B64'], validate=True))
              if set(batch) != {'batch_contract_version','payloads'} or batch['batch_contract_version'] != 'SIGSTORE_SEMANTIC_RECEIPT_BATCH_V1' or not isinstance(batch['payloads'], list) or not 1 <= len(batch['payloads']) <= 8: raise ValueError('invalid canonical batch')
              prior = ''
              for encoded in batch['payloads']:
                  if not isinstance(encoded, str): raise ValueError('payload encoding invalid')
                  raw = base64.b64decode(encoded, validate=True); item = load(raw)
                  if set(item) != payload_keys or canon(item) != raw: raise ValueError('payload is not closed canonical JSON')
                  if item['signer_repository'] != os.environ['SIGNER_REPOSITORY'] or item['signer_workflow_ref'] != os.environ['SIGNER_WORKFLOW_REF'] or item['signer_environment'] != 'semantic-signing': raise ValueError('signer identity binding mismatch')
                  for key in ('receipt_contract_version','semantic_core_contract_version','signer_contract_version','batch_id','request_id','subject_id','form','semantic_target_type','semantic_target_id','receipt_id','nonce'):
                      if not isinstance(item[key], str) or not ident.fullmatch(item[key]): raise ValueError('invalid identifier')
                  for key in ('source_evidence_binding_digest','semantic_review_payload_sha256','canonical_batch_sha256'):
                      if not isinstance(item[key], str) or not digest.fullmatch(item[key]): raise ValueError('invalid digest')
                  reqs = item['requirements']
                  if not isinstance(reqs, list) or not reqs or reqs != sorted(reqs, key=lambda x: (x.get('requirement_id',''), x.get('requirement_version',''), x.get('requirement_sha256',''))): raise ValueError('requirements ordering invalid')
                  for req in reqs:
                      if set(req) != {'requirement_id','requirement_version','requirement_sha256'} or not ident.fullmatch(req['requirement_id']) or not ident.fullmatch(req['requirement_version']) or not digest.fullmatch(req['requirement_sha256']): raise ValueError('invalid requirement')
                  for name, keys in (('provenance_binding',{'provenance_binding_id','provenance_sha256'}),('source_manifest',{'source_manifest_id','source_manifest_version','source_manifest_sha256'})):
                      value=item[name]
                      if set(value) != keys or any(not isinstance(x,str) for x in value.values()): raise ValueError('invalid '+name)
                  review=item['semantic_review']
                  if set(review) != {'dimensions','semantic_review_outcome','semantic_findings','blocking_findings'} or set(review['dimensions']) != {'S1','S2','S3','S4','S5','S6','S7','S8'}: raise ValueError('invalid semantic review')
                  if hashlib.sha256(canon(review)).hexdigest() != item['semantic_review_payload_sha256']: raise ValueError('semantic review digest mismatch')
                  batch_view=dict(item); batch_view['canonical_batch_sha256']=None
                  if hashlib.sha256(canon(batch_view)).hexdigest() != item['canonical_batch_sha256']: raise ValueError('canonical batch digest mismatch')
                  if item['receipt_id'] <= prior: raise ValueError('payload order invalid')
                  prior=item['receipt_id']; pathlib.Path('receipts', item['receipt_id'] + '.json').write_bytes(raw)
          except Exception as error:
              print('canonical payload rejection:', error, file=sys.stderr); raise SystemExit(64)
          PY

      - name: Keyless sign canonical payloads with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore")"
          export SIGSTORE_ID_TOKEN="$(jq -er '.value' <<< "$token_response")"
          for receipt in receipts/*.json; do
            cosign sign-blob --yes --bundle "${receipt%.json}.sigstore.json" "$receipt"
          done
          unset SIGSTORE_ID_TOKEN

      - name: Publish signed receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-receipt-batch-${{ github.run_id }}
          path: receipts/
          if-no-files-found: error
          retention-days: 7